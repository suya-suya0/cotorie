      localStorage.setItem(installHideKey,'yes');

applyTheme(localStorage.getItem(themeKey)==='yes');

let user=null,students=[],links=[],requests=[],messages=[],studyRecords=[],page='home',childId=null,kind='相談';
const grades=['小4','小5','小6','中1','中2','中3'];const formFields=`<label>メールアドレス</label><input name="email" type="email" autocomplete="email" required><label>パスワード</label><input name="password" type="password" autocomplete="new-password" minlength="8" required>`;

function loginPage(mode='login'){const register=mode==='register';$('logout').classList.add('hidden');$('app').innerHTML=`<div class="auth card"><h2>${register?'保護者の新規登録':'保護者ログイン'}</h2><div class="tabbar"><button class="${!register?'active':''}" id="showLogin">ログイン</button><button class="${register?'active':''}" id="showRegister">新規登録</button></div><form id="authform">${register?`<label>保護者の本名（姓・名）</label><input name="guardian" placeholder="例：田中 花子" required maxlength="100"><label>通塾しているお子さまの本名（姓・名）</label><input name="child" placeholder="例：田中 太郎" required maxlength="100"><label>学年</label><select name="grade">${grades.map(g=>`<option>${g}</option>`).join('')}</select>`:''}${formFields.replace('autocomplete="new-password"',`autocomplete="${register?'new-password':'current-password'}"`)}<p><label class="check"><input type="checkbox" name="keep" ${localStorage.getItem('manabi_keep')!=='no'?'checked':''}> ログイン状態を保持する</label></p><button type="submit">${register?'登録して承認を申請':'ログイン'}</button></form><p class="fieldhelp">${register?'メール確認が必要な設定の場合は、届いたメールのリンクから確認してください。確認後に初回申請が反映されます。':'パスワードを忘れた場合は、下のボタンから再設定できます。'}</p>${!register?'<button class="secondary" id="reset">パスワードを忘れた方</button>':''}<div class="divider"></div><p class="tiny">申請後、先生が確認・承認したお子さまの情報だけ表示されます。</p></div>`;$('showLogin').onclick=()=>loginPage('login');$('showRegister').onclick=()=>loginPage('register');if($('reset'))$('reset').onclick=()=>passwordResetRequestView();$('authform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);keepSession(f.get('keep')==='on');try{if(register){const guardian=f.get('guardian').trim(),child=f.get('child').trim();if(!guardian.includes(' ')&&!guardian.includes('　')||!child.includes(' ')&&!child.includes('　')){alert('保護者とお子さまの姓・名を両方入力してください');return}const {data,error}=await db.auth.signUp({email:f.get('email'),password:f.get('password'),options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;if(data.session){user=data.user;const {error:re}=await db.from('manabi_requests').insert({guardian_id:user.id,guardian_name:guardian,child_name:child,grade:f.get('grade')});if(re)throw re;await load();render();flash('申請を受け付けました。先生の承認をお待ちください。','ok')}else{sessionStorage.setItem('manabi_pending_request',JSON.stringify({guardian,child,grade:f.get('grade'),email:f.get('email')}));loginPage('login');flash('登録メールを確認してください。確認後、同じ端末でログインすると申請を送信します。','ok')}}else{await login(f.get('email'),f.get('password'),f.get('keep')==='on');await start()}}catch(ex){err(ex)}}}
async function completePending(){try{const p=JSON.parse(sessionStorage.getItem('manabi_pending_request')||'null');if(!p||!user)return;const {data:{user:who}}=await db.auth.getUser();if(!who||who.email?.toLowerCase()!==p.email.toLowerCase())return;const {error}=await db.from('manabi_requests').insert({guardian_id:user.id,guardian_name:p.guardian,child_name:p.child,grade:p.grade});if(error)throw error;sessionStorage.removeItem('manabi_pending_request')}catch(e){err(e)}}

function nav(){return `<nav class="bottom" aria-label="ページ切り替え"><button data-nav="home" class="${page==='home'?'active':''}">⌂ ホーム</button><button data-nav="contact" class="${page==='contact'?'active':''}">✉ 先生に連絡</button><button data-nav="requests" class="${page==='requests'?'active':''}">＋ 追加申請・変更</button><button data-nav="settings" class="${page==='settings'?'active':''}">⚙ 設定</button></nav>`}

function card(s){const recent=studyRecords.filter(r=>r.student_id===s.id).slice(0,5);return `<section class="card" style="margin:12px 0"><div class="row"><div><h3 style="margin:0">${esc(s.name)}</h3><div class="tiny">${esc(s.grade)}</div></div><span class="chip ${s.status}">${esc(s.status)}</span></div><div class="divider"></div><div class="row"><span class="tiny">先生の最終記録：${time(s.status_at)}</span><button class="secondary" data-contact="${s.id}">連絡する</button></div><div class="divider"></div><h4 style="margin:0 0 8px">最近の学習記録</h4>${recent.length?recent.map(r=>`<div class="entry row" style="gap:10px;align-items:center"><span><b>${esc(r.subject)}</b>　${Number(r.pages)}ページ</span><span class="tiny">${time(r.created_at)}</span></div>`).join(''):'<p class="tiny">先生が学習記録を登録すると、ここに表示されます。</p>'}${studyRecords.filter(r=>r.student_id===s.id).length>5?`<button class="secondary" data-studyhistory="${s.id}" style="margin-top:8px">すべての学習記録を見る</button>`:''}</section>`}
function home(){const pending=requests.filter(r=>r.state==='申請中');base(`<div class="subaru-home"><div class="home-heading"><span class="home-eyebrow">HOME</span><h2>お子さまの在室状況</h2><p class="tiny">先生が最後に記録した状態です。位置情報による確認ではありません。</p></div>${students.length?students.map(card).join(''):`<section class="card"><h3>${pending.length?'承認待ち':'お子さまが登録されていません'}</h3><p>${pending.length?'先生が登録申請を確認しています。承認されると、ここに在室状況が表示されます。':'下の「追加申請・変更」からお子さまの登録申請をしてください。'}</p></section>`}${pending.length?`<section class="card" style="margin-top:14px"><h3>申請中のお子さま</h3>${pending.map(r=>`<div class="entry row"><span>${esc(r.child_name)}（${esc(r.grade)}）</span><span class="chip">申請中</span></div>`).join('')}</section>`:''}<h2 class="quick-heading">メニュー</h2><div class="subaru-tiles"><button type="button" class="subaru-tile tile-green" data-shortcut="home"><span class="tile-ico" aria-hidden="true">⌂</span><span class="tile-title">ホーム</span><span class="tile-sub">在室状況・学習記録</span></button><button type="button" class="subaru-tile tile-pink" data-shortcut="contact"><span class="tile-ico" aria-hidden="true">✉</span><span class="tile-title">先生に連絡</span><span class="tile-sub">欠席・遅刻・早退・相談</span></button><button type="button" class="subaru-tile tile-yellow" data-shortcut="requests"><span class="tile-ico" aria-hidden="true">＋</span><span class="tile-title">追加申請・変更</span><span class="tile-sub">兄弟の登録・申請状況</span></button><button type="button" class="subaru-tile tile-green" data-shortcut="settings"><span class="tile-ico" aria-hidden="true">⚙</span><span class="tile-title">設定</span><span class="tile-sub">パスワード・表示</span></button></div></div>`);document.querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>{childId=b.dataset.contact;page='contact';render()});document.querySelectorAll('[data-studyhistory]').forEach(b=>b.onclick=()=>{childId=b.dataset.studyhistory;page='history';render()});document.querySelectorAll('[data-shortcut]').forEach(b=>b.onclick=()=>{page=b.dataset.shortcut;render()})}
function requestPage(){base(`<h2>追加申請・変更</h2><p class="tiny">お子さまの追加登録はこちらから。登録内容の変更が必要な場合は、先生に連絡してください。</p><section class="card"><h3>お子さまの追加申請</h3><form id="addRequest"><label>保護者の本名（姓・名）</label><input name="guardian" required maxlength="100" placeholder="例：田中 花子"><label>お子さまの本名（姓・名）</label><input name="child" required maxlength="100" placeholder="例：田中 太郎"><label>学年</label><select name="grade">${grades.map(g=>`<option>${g}</option>`).join('')}</select><p><button type="submit">申請する</button></p></form></section><section class="card" style="margin-top:14px"><h3>申請状況</h3>${requests.map(r=>`<div class="entry row"><span>${esc(r.child_name)}（${esc(r.grade)}）</span><span class="chip">${esc(r.state)}</span></div>`).join('')||'<p class="tiny">申請はありません。</p>'}</section><section class="card" style="margin-top:14px"><h3>登録内容を変更したいとき</h3><p>お名前・学年などの訂正、登録済みのお子さまの変更・解除は先生にご連絡ください。</p><button class="secondary" id="changeContact">先生に連絡する</button></section>`);$('changeContact').onclick=()=>{page='contact';render()};$('addRequest').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const guardian=String(f.get('guardian')||'').trim(),child=String(f.get('child')||'').trim(),grade=String(f.get('grade')||'');if(!guardian.includes(' ')&&!guardian.includes('　')||!child.includes(' ')&&!child.includes('　')){alert('保護者とお子さまの姓・名を両方入力してください');return}if(requests.some(r=>r.child_name===child&&r.state==='申請中')){alert('同じお子さまの申請が承認待ちです。申請状況をご確認ください。');return}if(!confirm('お名前を確認して申請しますか？'))return;try{const {error}=await db.from('manabi_requests').insert({guardian_id:user.id,guardian_name:guardian,child_name:child,grade});if(error)throw error;await refresh();flash('登録申請を送信しました','ok')}catch(e){err(e)}}}
function contact(){const s=students.find(x=>x.id===childId)||students[0];if(s)childId=s.id;base(`<h2>先生に連絡</h2>${students.length?`<label>お子さまを選択</label><select id="childSelect">${students.map(x=>`<option value="${x.id}" ${x.id===childId?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="tabbar" style="margin-top:18px">${['欠席','遅刻','早退','相談'].map(k=>`<button data-kind="${k}" class="${kind===k?'active':''}">${k}</button>`).join('')}</div><div class="chat" id="chat">${messages.filter(x=>x.student_id===childId&&x.kind===kind).slice().reverse().map(m=>`<div class="bubble ${m.sender==='保護者'?'mine':''}">${esc(m.body)}<small>${esc(m.sender)} · ${esc(m.kind)} · ${time(m.created_at)}</small></div>`).join('')||'<p class="tiny">メッセージはまだありません。</p>'}</div><form id="send"><label>メッセージ（${kind==='相談'?'400':'150'}文字以内）</label><textarea id="body" maxlength="${kind==='相談'?'400':'150'}" required placeholder="内容を入力してください"></textarea><div class="row"><span class="tiny" id="count">0文字</span><button type="submit">送信する</button></div></form>`:'<section class="card"><p>まだ承認されたお子さまがいません。「追加申請・変更」から登録申請してください。</p></section>'}`);if(!s)return;$('childSelect').onchange=e=>{childId=e.target.value;render()};document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;render()});$('body').oninput=e=>$('count').textContent=e.target.value.length+'文字';$('send').onsubmit=async e=>{e.preventDefault();const body=$('body').value.trim();if(!body)return;try{const {error}=await db.from('manabi_messages').insert({student_id:childId,guardian_id:user.id,sender:'保護者',kind,body});if(error)throw error;await refresh();flash('先生に送信しました','ok')}catch(e){err(e)}}}
function historyPage(){const s=students.find(x=>x.id===childId),records=studyRecords.filter(r=>r.student_id===childId);base(`<h2>${s?esc(s.name)+'さんの':'お子さまの'}学習記録</h2><button class="secondary" id="historyBack">ホームに戻る</button><section class="card" style="margin-top:12px">${records.length?records.map(r=>`<div class="entry row"><span><b>${esc(r.subject)}</b>　${Number(r.pages)}ページ</span><span class="tiny">${time(r.created_at)}</span></div>`).join(''):'<p>まだ学習記録はありません。</p>'}</section>`);$('historyBack').onclick=()=>{page='home';render()}}
function render(){if(recoveryMode)return;if(page==='contact')contact();else if(page==='requests')requestPage();else if(page==='history')historyPage();else if(page==='settings')settingsPage();else home()}
async function refresh(){try{await load();render()}catch(e){err(e)}}
function settingsPage(){
  base(`<h2>設定</h2><section class="card settings-block"><h3>画面の表示</h3><label class="check"><input type="checkbox" id="themeToggle" ${document.body.classList.contains('dark')?'checked':''}> ダークモード</label><p class="settings-caption">端末ごとに設定が保存されます。いつでも元に戻せます。</p></section><section class="card settings-block"><h3>アカウントとパスワード</h3><p class="tiny">ログイン中：${esc(user?.email||'')}</p><button id="changePassword" class="secondary">パスワードを変更する</button><p class="settings-caption">ログイン中のアカウントのパスワードを変更します。</p></section>`);
  $('themeToggle').onchange=e=>applyTheme(e.target.checked);
  $('changePassword').onclick=()=>passwordChangeView();
}
function passwordResetRequestView(){
  $('logout').classList.add('hidden');
  $('app').innerHTML=`<section class="card auth"><h2>パスワードを忘れた方</h2><p>登録したメールアドレスに、パスワード再設定用のリンクを送ります。</p><form id="requestReset"><label for="resetEmail">メールアドレス</label><input type="email" id="resetEmail" required autocomplete="email" placeholder="example@email.com"><p><button type="submit">再設定メールを送信</button></p></form><button class="neutral" id="backLogin">ログイン画面に戻る</button><p class="tiny">届いたメールのリンクを開いたら、新しいパスワードを設定できます。メールが見つからない場合は迷惑メールフォルダも確認してください。</p></section>`;
  $('backLogin').onclick=()=>loginPage('login');
  $('requestReset').onsubmit=async e=>{e.preventDefault();let button=e.target.querySelector('button[type=submit]');button.disabled=true;try{
    const {error}=await db.auth.resetPasswordForEmail($('resetEmail').value.trim(),{redirectTo:new URL('./parent.html',location.href).href});
    if(error)throw error;
    flash('再設定メールの送信を受け付けました。メール内のリンクを開いてください。','ok');
  }catch(e){err(e)}finally{button.disabled=false}};
}
function passwordFields(heading,fromRecovery){
  $('app').innerHTML=`<section class="card auth"><h2>${heading}</h2><p>${fromRecovery?'メールの確認が完了しました。新しいパスワードを入力してください。':'ログイン中のアカウントのパスワードを変更します。'}</p><form id="passwordForm"><label for="newPw">新しいパスワード（8文字以上）</label><input id="newPw" type="password" minlength="8" autocomplete="new-password" required><label for="newPwConfirm">新しいパスワード（確認）</label><input id="newPwConfirm" type="password" minlength="8" autocomplete="new-password" required><p><button type="submit">パスワードを保存</button></p></form>${fromRecovery?'':`<button class="neutral" id="passwordBack">設定に戻る</button>`}</section>${fromRecovery?'':nav()}`;
  if(!fromRecovery){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;render()});$('passwordBack').onclick=()=>settingsPage()}
  $('passwordForm').onsubmit=async e=>{e.preventDefault();const a=$('newPw').value,b=$('newPwConfirm').value;if(a!==b){flash('パスワードが一致しません。','error');return}let btn=e.target.querySelector('button[type=submit]');btn.disabled=true;try{
    const {error}=await db.auth.updateUser({password:a});if(error)throw error;
    recoveryMode=false;recoveryScreenVisible=false;
    if(fromRecovery){history.replaceState({},'',location.pathname);await start()}
    else{page='settings';render()}
    flash('パスワードを変更しました。','ok');
  }catch(e){err(e)}finally{btn.disabled=false}};
}
function passwordChangeView(){page='settings';passwordFields('パスワードを変更',false)}
function resetPasswordView(){recoveryMode=true;recoveryScreenVisible=true;$('logout').classList.add('hidden');passwordFields('新しいパスワードを設定',true)}
if(db)db.auth.onAuthStateChange((event)=>{
  if(event==='PASSWORD_RECOVERY'){recoveryMode=true;setTimeout(resetPasswordView,0)}
});
// Recovery emails arrive with auth tokens in the URL. Don't show the normal
// dashboard before the recovery callback establishes the session.
if(recoveryMode){
  $('app').innerHTML='<section class="card auth"><h2>パスワード再設定</h2><p>確認中です…</p></section>';
  if(db)db.auth.initialize().then(async()=>{if(recoveryMode&&!recoveryScreenVisible){const {data:{user:recoveryUser},error}=await db.auth.getUser();if(error||!recoveryUser){flash('再設定リンクが無効か期限切れです。ログイン画面から再度メールを送ってください。','error');loginPage('login');return}resetPasswordView()}}).catch(err);
}else{
  authView(start).then(u=>{if(!u&&db&&!recoveryMode)loginPage()}).catch(err);
}
setInterval(()=>{if(!document.hidden&&user&&!recoveryMode&&page!=='settings')refresh()},45000);
</script></body></html>
