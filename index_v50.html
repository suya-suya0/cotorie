<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="コトリエ">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#8a78c8">
<title>コトリエ / Cotorie<span style="font-size:10px;color:#9b91a8;margin-left:6px">v37</span></title>
<style>
:root{--bg:#fbf8f3;--paper:#fffdf9;--lav:#8a78c8;--lav2:#d8cef3;--blue:#dceef8;--pink:#f6dfe6;--ink:#383345;--muted:#7d7689;--line:#ebe4ef}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fbf8f3,#f8f3fb);color:var(--ink);font-family:"Yu Gothic",system-ui,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:84px}.top{position:sticky;top:0;z-index:5;background:#fbf8f3ee;backdrop-filter:blur(10px);padding:15px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:900;font-size:20px}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:600}.role{border:1px solid var(--lav2);background:white;color:var(--lav);border-radius:999px;padding:8px 10px;font-weight:800}
main{padding:15px}.hero,.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:0 7px 22px #57496b12}
.hero{background:linear-gradient(135deg,#eee7fb,#edf6fb,#fdf1f4)}h1,h2,h3,p{margin-top:0}.hero h1{font-size:21px;margin-bottom:5px}.muted,.card p{color:var(--muted);font-size:13px;line-height:1.55}
.row{display:flex;align-items:center;gap:10px}.space{justify-content:space-between}.avatar{width:47px;height:47px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--blue));font-size:23px}
.name{font-weight:900}.meta{color:var(--muted);font-size:11px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.tag,.pill{font-size:10px;border-radius:999px;padding:5px 8px;background:#f5f1fa}.pill{color:#6656a3;font-weight:800}.btn{border:0;border-radius:13px;background:var(--lav);color:white;padding:10px 12px;font-weight:900}.btn.alt{background:white;color:var(--lav);border:1px solid var(--lav2)}.btn.soft{background:#f1ecfb;color:#6656a3}.btn.full{width:100%}
.points{display:flex;justify-content:space-between;align-items:center;background:#fff9e8;border:1px solid #f1e7c7;border-radius:17px;padding:12px 14px;margin-bottom:12px}.points strong{font-size:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}.grid2home{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}.grid2home button{background:white;border:1px solid var(--line);border-radius:16px;padding:12px 5px;font-weight:800}.grid2home span{display:block;font-size:21px}.grid button{background:white;border:1px solid var(--line);border-radius:16px;padding:12px 5px;font-weight:800}.grid span{display:block;font-size:21px}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf9f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:7px}.nav button{border:0;background:transparent;color:#99919f;padding:4px}.nav button.active{color:var(--lav);font-weight:900}.nav b{display:block;font-size:18px}.nav small{font-size:9px}
.section{font-size:15px;font-weight:900;margin:18px 2px 9px}.search{display:flex;gap:7px;margin-bottom:12px}.search input,.field textarea,.field input,.field select{width:100%;border:1px solid var(--line);border-radius:12px;background:white;padding:11px}.search input{flex:1}.message{padding:11px 0;border-bottom:1px solid var(--line)}.message:last-child{border:0}.live{color:#d85f6c;font-weight:900}.notice{font-size:11px;color:var(--muted);background:#f7f3f8;border-radius:12px;padding:9px 10px;line-height:1.5}
.modalbg{position:fixed;inset:0;background:#312a3c66;z-index:20;display:grid;place-items:end center;padding:15px}.modal{width:min(500px,100%);background:var(--paper);padding:17px;border-radius:22px}.hidden{display:none!important}.field{margin:10px 0}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}
.stat{font-size:23px;font-weight:900;color:var(--lav)}.bar{height:8px;border-radius:999px;background:#eee8f1;overflow:hidden}.bar div{height:100%;background:var(--lav)}

/* v2: smartphone-app first */
html,body{min-height:100%;overscroll-behavior:none}
body{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{width:100%;max-width:480px;background:var(--bg);position:relative}
.top{padding-top:max(15px,env(safe-area-inset-top));min-height:64px}
.nav{padding-bottom:max(7px,env(safe-area-inset-bottom))}
.btn,.nav button,.grid button,.role{min-height:44px}
@media (min-width:700px){
  body{background:#ebe7ef;display:flex;justify-content:center}
  .app{box-shadow:0 0 40px #493d5d22}
}
.launch{
  position:fixed;inset:0;z-index:100;background:
  radial-gradient(circle at 25% 20%,#f8e6ed 0,transparent 32%),
  radial-gradient(circle at 80% 25%,#e5f2fa 0,transparent 32%),
  linear-gradient(160deg,#faf7f1,#f5effc);
  display:flex;align-items:center;justify-content:center;padding:24px
}
.launchbox{width:min(430px,100%);text-align:center}
.birdmark{
  width:94px;height:94px;border-radius:28px;margin:0 auto 18px;
  display:grid;place-items:center;font-size:48px;
  background:white;border:1px solid var(--line);box-shadow:0 14px 40px #6356751f
}
.launch h1{font-size:30px;margin:0 0 4px}.launch .lead{color:var(--muted);margin-bottom:28px}
.authcard{text-align:left;background:#fffdf9;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 14px 40px #63567514}
.authcard h2{font-size:20px;margin-bottom:6px}.authcard .field input{font-size:16px}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.rolepick button{border:1px solid var(--line);background:white;border-radius:18px;padding:16px 8px;color:var(--ink);font-weight:900}
.rolepick button.selected{border-color:var(--lav);background:#f2edfb;color:#6553a0}
.rolepick span{display:block;font-size:28px;margin-bottom:6px}
.onboard-dots{display:flex;justify-content:center;gap:7px;margin:14px 0}
.onboard-dots i{display:block;width:7px;height:7px;border-radius:50%;background:#d8d2db}
.onboard-dots i.on{width:20px;border-radius:999px;background:var(--lav)}
.installhint{display:none;margin:9px 0 0;padding:10px;border-radius:12px;background:#f5f1fa;color:var(--muted);font-size:11px;line-height:1.5}
.appbadge{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:#6e6380;background:white;border:1px solid var(--line);border-radius:999px;padding:5px 8px;margin-top:8px}


/* v8: アタメ一覧をスマホで押しやすく */
.atame-user{
  width:100%;
  padding:10px 12px;
  margin-bottom:8px;
}
.atame-user .row.space{
  width:100%;
  gap:12px;
}
.atame-user .row.space > .row{
  flex:1;
  min-width:0;
}
.atame-user .avatar{
  width:46px;
  height:46px;
  font-size:22px;
  flex:0 0 46px;
}
.atame-user .btn{
  min-width:70px;
  min-height:46px;
  padding:0 14px;
  border-radius:14px;
  font-size:15px;
  flex:0 0 auto;
}
.atame-user .name,
.atame-user strong{
  font-size:16px;
}
.atame-user .meta{
  font-size:11px;
  line-height:1.35;
}
.atame-name-line{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:2px;
}
.atame-inline-tags{
  display:flex;
  gap:4px;
  flex-wrap:wrap;
}
.atame-inline-tags .tag{
  padding:3px 6px;
  font-size:9px;
}
#homeAtameList,
#atameList{
  width:100%;
}


/* v12: スマホとPCで同じUI */
.app{
  width:100%;
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
}
.nav{
  width:min(480px,100%);
}
@media (min-width:700px){
  body{
    background:#ece8f1;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
  }
  .app{
    width:480px;
    min-height:100vh;
    margin:0 auto;
    background:var(--bg);
    box-shadow:0 0 42px rgba(67,55,86,.16);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }
  .top{
    width:480px;
    margin:0 auto;
  }
  .nav{
    width:480px;
  }
  .launchbox{
    width:430px;
  }
}


/* v14 */
.cotorie-logo{position:relative;display:flex;align-items:center;gap:5px;overflow:visible}
.brand-text{font-weight:900;letter-spacing:.4px}
.vine{color:#719064;font-size:15px;line-height:1;opacity:.95}
.vine-left{transform:rotate(-24deg)}
.vine-right{transform:scaleX(-1) rotate(-24deg)}
.brand-bird{position:absolute;right:-18px;top:-7px;font-size:17px;filter:drop-shadow(0 2px 2px #0001)}
.profile-head{display:flex;gap:12px;align-items:center}
.profile-avatar{width:64px;height:64px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,var(--pink),var(--blue));border:2px solid white;box-shadow:0 5px 14px #0001}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.profile-grid select{width:100%}
.icon-picker{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:8px}
.icon-choice{border:1px solid var(--line);background:linear-gradient(180deg,#fff,#faf7fd);border-radius:16px;min-height:54px;font-size:25px;box-shadow:0 4px 12px #57496b0d}
.icon-choice.active{border:2px solid var(--lav);background:#f0eafb;transform:translateY(-1px)}
.upload-box{border:1.5px dashed #cfc5dc;border-radius:15px;padding:12px;background:#faf8fc}
.ledger-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ledger-item:last-child{border-bottom:0}.ledger-title{font-weight:800;font-size:13px}.ledger-sub{font-size:11px;color:var(--muted);margin-top:2px}.ledger-minus{font-weight:900;color:#9e6677;white-space:nowrap}
.safety-note{font-size:11px;line-height:1.55;color:var(--muted);background:#f6f2f8;border-radius:12px;padding:9px 10px;margin-top:7px}


/* v16: scrollable modal + profile time field */
.modalbg{
  overflow-y:auto;
  align-items:flex-start;
  padding-top:max(16px,env(safe-area-inset-top));
  padding-bottom:max(16px,env(safe-area-inset-bottom));
}
.modal{
  max-height:calc(100vh - 32px);
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
@media (min-width:700px){
  .modalbg{
    align-items:center;
  }
  .modal{
    max-height:calc(100vh - 48px);
  }
}
.time-range{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.active-slot{
  background:#eee8fb!important;
  color:#6553a0!important;
  border-color:#cfc1ef!important;
  font-weight:900;
}
#activeSlotPicker .tag{
  border:1px solid var(--line);
  cursor:pointer;
}

/* v18 */
.discover-head{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}
.discover-head h2{font-size:16px;margin:0}.filter-link{border:1px solid var(--line);background:white;color:var(--lav);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900}
.select-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice-wrap{display:flex;flex-wrap:wrap;gap:6px}.choice-chip{border:1px solid var(--line);background:white;border-radius:999px;padding:7px 9px;font-size:11px;color:var(--muted)}
.choice-chip.active{background:#efeafb;color:#6553a0;border-color:#cfc1ef;font-weight:900}.history-card{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.history-card:last-child{border-bottom:0}.chat-shell{display:flex;flex-direction:column;gap:10px}.chat-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chat-log{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:8px 2px}.bubble{max-width:78%;padding:9px 11px;border-radius:16px;font-size:13px;line-height:1.45}
.bubble.me{align-self:flex-end;background:#8a78c8;color:white;border-bottom-right-radius:5px}.bubble.them{align-self:flex-start;background:#f2eef5;color:var(--ink);border-bottom-left-radius:5px}
.chat-compose{display:flex;gap:7px;align-items:flex-end}.chat-compose textarea{flex:1;min-height:46px;max-height:92px}.note-box{background:#fff9e8;border:1px solid #f0e3bc;border-radius:15px;padding:11px;margin-top:8px}
.note-box textarea{min-height:72px}.section-tabs{display:flex;gap:8px;margin-bottom:10px}.section-tabs button{flex:1;border:1px solid var(--line);background:white;border-radius:13px;padding:9px;font-weight:800;color:var(--muted)}
.section-tabs button.active{background:#efeafb;color:#6553a0;border-color:#d4c7ef}

/* v21: message list cleanup */
.msg-list{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:4px 14px;box-shadow:0 6px 20px rgba(78,61,110,.06)}
.msg-row{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.msg-row:last-child{border-bottom:none}
.msg-main{flex:1;min-width:0}
.msg-name{font-weight:900;font-size:14px;margin-bottom:4px}
.msg-preview{font-size:14px;line-height:1.45;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-meta{font-size:10px;color:var(--muted);margin-top:3px}
.unread-count{min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--lav);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900}


/* v26: LINE-like cute chat compose + cast memo toggle */
.chat-compose{
  display:flex;
  align-items:flex-end;
  gap:8px;
  background:#f6f1fb;
  border:1px solid #e3d9f1;
  border-radius:22px;
  padding:8px;
  box-shadow:0 4px 14px rgba(109,87,148,.08);
}
.chat-compose textarea{
  flex:1;
  min-height:42px;
  max-height:90px;
  border:none;
  background:white;
  border-radius:18px;
  padding:11px 14px;
  resize:none;
  box-shadow:inset 0 0 0 1px #e7dff1;
}
.chat-compose textarea:focus{
  outline:none;
  box-shadow:inset 0 0 0 2px #c8b5ea;
}
.chat-send{
  min-width:62px;
  height:46px;
  border-radius:16px;
  font-weight:900;
}
.memo-mini-btn{
  width:42px;
  height:42px;
  border-radius:14px;
  border:1px solid #dbcdea;
  background:white;
  font-size:18px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
}
.memo-drawer{
  margin-top:10px;
  background:#fff9e8;
  border:1px solid #f0e3bc;
  border-radius:16px;
  padding:12px;
}
.memo-drawer textarea{
  min-height:78px;
  border-radius:14px;
  background:#fffef9;
}


/* v27 */
.chat-page{min-height:calc(100vh - 72px);display:flex;flex-direction:column;background:#f8f5fa;margin:-15px;padding:0 0 18px}
.chat-page-head{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(255,253,249,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.chat-back{border:0;background:transparent;font-size:24px;color:var(--lav);width:38px;height:38px;border-radius:12px}
.chat-person{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.chat-page-log{flex:1;display:flex;flex-direction:column;gap:10px;padding:16px 14px 10px;overflow-y:auto}
.chat-page-compose{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;margin:0 10px;padding:8px;background:#efe9f6;border:1px solid #dfd3ec;border-radius:22px;box-shadow:0 8px 22px rgba(81,63,111,.12)}
.chat-page-compose textarea{flex:1;min-height:44px;max-height:90px;border:0;border-radius:18px;padding:11px 14px;background:white;resize:none}
.chat-page-compose textarea:focus{outline:2px solid #c8b5ea}
.chat-page-note{margin:0 12px 10px}
.atame-avatar-btn{border:0;background:transparent;padding:0;display:block;border-radius:50%;cursor:pointer}
.radio-tag-wrap{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 12px}
.radio-tag{border:1px solid var(--line);background:white;color:var(--muted);padding:7px 10px;border-radius:999px;font-size:11px}
.radio-tag.active{background:#eee8fb;color:#6553a0;border-color:#cfc1ef;font-weight:900}
.radio-search{display:flex;gap:8px;margin-bottom:10px}
.radio-search input{flex:1;border:1px solid var(--line);border-radius:14px;padding:11px 12px}


/* v30: separated login entry for user / cast */
.login-gate{
  min-height:calc(100vh - 20px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 14px 40px;
}
.login-card{
  width:min(100%,430px);
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:28px;
  padding:22px;
  box-shadow:0 12px 30px rgba(79,61,111,.10);
}
.login-brand{
  text-align:center;
  margin-bottom:18px;
}
.login-brand h1{
  margin:4px 0 6px;
  font-size:28px;
}
.login-role-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:16px 0;
}
.login-role-card{
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px 12px;
  background:white;
  text-align:center;
  cursor:pointer;
}
.login-role-card strong{display:block;font-size:15px;margin-top:8px}
.login-role-card .role-emoji{font-size:32px}
.login-role-card.active{
  border-color:#c7b6ea;
  background:#f4effc;
  box-shadow:inset 0 0 0 1px #c7b6ea;
}
.login-form{margin-top:12px}
.login-form .field{margin-bottom:12px}
.login-note{
  margin-top:12px;
  font-size:11px;
  line-height:1.6;
  color:var(--muted);
  text-align:center;
}
.login-switch{
  margin-top:12px;
  text-align:center;
}
.app-role-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  font-weight:900;
  padding:6px 10px;
  border-radius:999px;
  background:#f1ecf8;
  color:#6553a0;
}


/* v31: real chat */
.chat-status{font-size:10px;color:var(--muted);margin-left:auto}
.chat-empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:12px}
.chat-message-time{font-size:9px;opacity:.65;margin-top:4px}
.chat-page-log .bubble{max-width:78%;word-break:break-word}
.chat-page-log .bubble.me{align-self:flex-end}
.chat-page-log .bubble.them{align-self:flex-start}
.chat-config{margin:12px 0}
.chat-config input{width:100%;box-sizing:border-box}


/* v34: visible Supabase connection status */
.connection-status{
  margin-top:10px;
  padding:10px 12px;
  border-radius:14px;
  font-size:12px;
  line-height:1.5;
  background:#f5f2f8;
  border:1px solid var(--line);
}
.connection-status.ok{background:#eef9f1;border-color:#bfe0c7}
.connection-status.ng{background:#fff1f1;border-color:#efc5c5}
.connection-status.wait{background:#fff9e8;border-color:#ead9a7}


#chatConnectBtn{
  display:block !important;
  width:100% !important;
  visibility:visible !important;
  opacity:1 !important;
  margin-top:12px;
}


/* v40: reliable persisted chat */
.bubble.pending{opacity:.62}
.bubble.failed{border:1px solid #e7a9a9}
.chat-error{
  margin:6px 12px 0;
  padding:8px 10px;
  border-radius:12px;
  background:#fff1f1;
  border:1px solid #efc5c5;
  font-size:11px;
  color:#8f3d3d;
}


/* v42: stamps + real audio radio */
.stamp-btn{
  width:42px;height:42px;border-radius:14px;border:1px solid #dbcdea;
  background:white;font-size:20px;display:grid;place-items:center;flex:0 0 auto
}
.stamp-panel{
  margin:0 10px 10px;padding:10px;background:#fff;border:1px solid var(--line);
  border-radius:18px;box-shadow:0 8px 22px rgba(81,63,111,.10)
}
.stamp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

(async function cotorieV37CacheCleanup(){
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){
    console.warn("cache cleanup",e);
  }
})();





async function syncCotorieProfile(){
  const client=ensureChatClient();
  if(!client){
    throw new Error("Supabaseクライアントを作成できませんでした");
  }

  const role=S.role||"user";
  const p=getProfile(role);
  const account_id=currentAccountId();

  const payload={
    account_id:account_id,
    role:role,
    nickname:(p&&p.name)||role,
    avatar_text:(p&&p.icon)||"",
    hobbies:(p&&p.hobbies)||"",
    bio:(p&&p.bio)||"",
    updated_at:new Date().toISOString()
  };

  const response=await client
    .from("cotorie_profiles")
    .upsert(payload,{onConflict:"account_id"});

  if(response.error){
    throw response.error;
  }
  return response.data;
}


window.syncCotorieProfile=syncCotorieProfile;

function safeJSON(value, fallback){
  try{return value ? JSON.parse(value) : fallback;}catch(e){return fallback;}

function launchRender(step=APP.onboarded?99:0){
  const launch=document.querySelector("#launch");
  const box=document.querySelector("#launchBox");
  if(step===99){
    launch.classList.add("hidden");
    return;
  }
  launch.classList.remove("hidden");

  if(step===0){
    box.innerHTML=`
      <div class="birdmark">🐦</div>
      <h1>Cotorie</h1>
      <div class="lead"></div>
      <div class="authcard">
        <h2>コトリエへようこそ</h2>
        <p class="muted">20歳以上限定の、ノンアダルトなコミュニケーションサービス。</p>
        <button class="btn full" onclick="launchRender(1)">はじめる</button>
        <button class="btn alt full" style="margin-top:9px" onclick="demoLogin()">ログイン</button>
        <div class="appbadge">📱 スマホアプリ向け試作版</div>
      </div>`;
    return;
  }

  if(step===1){
    box.innerHTML=`
      <div class="birdmark">🪽</div>
      <div class="onboard-dots"><i class="on"></i><i></i><i></i></div>
      <div class="authcard">
        <h2>どちらとして使いますか？</h2>
        <p class="muted">あとから試作版の切替ボタンでも確認できます。</p>
        <div class="rolepick">
          <button id="pickUser" class="selected" onclick="pickRole('user')"><span>💬</span>利用者</button>
          <button id="pickCast" onclick="pickRole('cast')"><span>🌙</span>キャスト</button>
        </div>
        <button class="btn full" onclick="launchRender(2)">次へ</button>
      </div>`;
    APP.selectedRole="user";
    return;
  }

  if(step===2){
    box.innerHTML=`
      <div class="birdmark">✍️</div>
      <div class="onboard-dots"><i></i><i class="on"></i><i></i></div>
      <div class="authcard">
        <h2>プロフィールをつくる</h2>
        <p class="muted">本番ではここに本人確認や20歳以上確認が入ります。</p>
        <div class="field"><label>ニックネーム</label><input id="newName" value="${APP.selectedRole==="cast"?"ひな":"ことり"}" maxlength="20"></div>
        <div class="field"><label>メールアドレス</label><input type="email" placeholder="example@cotorie.jp"></div>
        <div class="field"><label>パスワード</label><input type="password" value="demopass"></div>
        <button class="btn full" onclick="completeSignup()">登録してはじめる</button>
      </div>`;
    return;
  }

  if(step===3){
    box.innerHTML=`
      <div class="birdmark">✓</div>
      <div class="onboard-dots"><i></i><i></i><i class="on"></i></div>
      <div class="authcard" style="text-align:center">
        <h2>準備できました</h2>
        <p class="muted">${APP.selectedRole==="cast"?"キャスト":"利用者"}としてコトリエを体験できます。</p>
        <button class="btn full" onclick="enterApp()">コトリエを開く</button>
      </div>`;
  }
}
function pickRole(role){
  APP.selectedRole=role;
  document.querySelector("#pickUser")?.classList.toggle("selected",role==="user");
  document.querySelector("#pickCast")?.classList.toggle("selected",role==="cast");
}
function completeSignup(){
  const name=document.querySelector("#newName")?.value.trim();
  if(!name){alert("ニックネームを入力してください");return;}
  APP.displayName=name;
  localStorage.cotorie_displayName=name;
  localStorage.cotorie_selectedRole=APP.selectedRole;
  launchRender(3);
}
function enterApp(){
  APP.onboarded=true;

  document.querySelector("#launch").classList.add("hidden");

async function loadMessageList(){
 const client=ensureChatClient(), me=currentAccountId(), req=++listRequest;
 if(!client){if(S.page==="messages")document.querySelector("#talkList").textContent="会話機能を設定してください。";return;}
 try{
 const fields="id,thread_id,sender_id,receiver_id,body,message_type,stamp_id,created_at";

 for(const r of results)if(r.error)throw r.error;
 if(req!==listRequest||me!==currentAccountId())return;
 const rows=results.flatMap(r=>r.data||[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)||Number(b.id)-Number(a.id));
 const latest=Object.create(null);
 for(const m of rows){const peer=m.sender_id===me?m.receiver_id:m.sender_id;if(peer.startsWith(S.role==="cast"?"user:":"cast:")&&!latest[peer])latest[peer]=m;}
 messageListCache=latest; drawMessageList();
 }catch(e){const host=document.querySelector("#talkList");if(host&&req===listRequest)host.textContent="読み込み失敗："+(e.message||e);}
}
function formatListTime(ts){
  try{
    const d=new Date(ts);
    const now=new Date();
    if(d.toDateString()===now.toDateString()){
      return d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
    }
    const y=new Date(now);
    y.setDate(now.getDate()-1);
    if(d.toDateString()===y.toDateString()) return "昨日";
    return `${d.getMonth()+1}/${d.getDate()}`;
  }catch(e){
    return "";
  }
}

async function loadRadioComments(roomId){
  const client=radioClient();
  if(!client || !roomId) return [];
  const {data,error}=await client
    .from("cotorie_radio_comments")
    .select("id,room_id,sender_role,display_name,body,created_at")
    .eq("room_id",roomId)
    .order("created_at",{ascending:true})
    .limit(200);

  if(error){
    console.error("loadRadioComments:", error);
    return [];
  }
  radioCommentsCache=data||[];
  updateLiveCommentsUI();
  updateListenerCommentsUI();
  return radioCommentsCache;
}

function updateLiveCommentsUI(){
  const host=document.querySelector("#liveCommentOverlay")||document.querySelector("#listenerLiveCommentOverlay");
  if(host) host.innerHTML=liveCommentsHtml();
  updateCastChatLogUI();
}

function updateListenerCommentsUI(){
  const host=document.querySelector("#listenerCommentsWrap");
  if(host) host.innerHTML=listenerCommentsHtml();
  updateCastChatLogUI();
}

function subscribeRadioComments(roomId){
  const client=radioClient();
  if(!client || !roomId) return;

  if(radioCommentsChannel){
    try{client.removeChannel(radioCommentsChannel)}catch(e){}
    radioCommentsChannel=null;
  }

  radioCommentsChannel=client.channel("radio-comments:"+roomId)
    .on("postgres_changes",{
      event:"INSERT",
      schema:"public",
      table:"cotorie_radio_comments",
      filter:`room_id=eq.${roomId}`
    }, payload=>{
      const row=payload.new;
      if(row && !radioCommentsCache.some(x=>x.id===row.id)){
        radioCommentsCache=[...radioCommentsCache,row].slice(-50);
        updateLiveCommentsUI();
        updateListenerCommentsUI();
      }
    })
    .subscribe(status=>{
      if(status==="SUBSCRIBED"){
        loadRadioComments(roomId);
      }
    });
}

async function sendRadioComment(body,senderRole,displayName){
  const client=radioClient();
  if(!client || !radioCurrentRoomId || !body.trim()) return null;

  const {data,error}=await client
    .from("cotorie_radio_comments")
    .insert({
      room_id:radioCurrentRoomId,
      sender_role:senderRole,
      display_name:displayName,
      body:body.trim()
    })
    .select("id,room_id,sender_role,display_name,body,created_at")
    .single();

  if(error){
    console.error("sendRadioComment:", error);
    alert("コメント送信に失敗しました: " + error.message);
    return null;
  }

  if(data && !radioCommentsCache.some(x=>x.id===data.id)){
    radioCommentsCache=[...radioCommentsCache,data].slice(-50);
    updateLiveCommentsUI();
    updateListenerCommentsUI();
  }

  return data;
}

function computeEarnedPointsFromSeconds(sec){
  const minutes=Math.ceil(sec/60);
  return Math.max(0, minutes-3)*2;
}

async function createRadioRoom(){
  if(!radioSafetyReady()){alert("配信前の注意事項にすべて同意してください");return;}
  const client=radioClient();
  if(!client){openChatSetup();return;}

  const draft=getRadioDraft();
  if((draft.tags||[]).length>5){

    return;
  }

  try{

  }catch(err){

    return;
  }

  radioCurrentRoomId=makeRoomId();
  radioHostStats={startedAt:Date.now(),currentListeners:{},totalPaidPoints:0,totalListenerMinutes:0};

  const p=getProfile("cast");
  const room={
    room_id:radioCurrentRoomId,
    cast_account_id:currentAccountId(),
    cast_name:p?.name||"キャスト",
    title:draft.title,
    tags:draft.tags,

function startRadioHostSignaling(roomId){
  const client=radioClient();
  if(!client) return;

  if(radioSignalChannel){
    try{client.removeChannel(radioSignalChannel)}catch(e){}
  }

  radioSignalChannel=client.channel("radio:"+roomId);

  radioSignalChannel
    .on("broadcast",{event:"join"},async ({payload})=>{
      const listenerId=payload.listener_id;
      if(!listenerId || !radioLocalStream) return;

      radioHostStats.currentListeners[listenerId]=Date.now();

      const pc=new RTCPeerConnection(rtcConfig());
      radioHostPeers[listenerId]=pc;
      radioLocalStream.getTracks().forEach(track=>pc.addTrack(track,radioLocalStream));

      pc.onicecandidate=e=>{
        if(e.candidate){
          radioSignalChannel.send({
            type:"broadcast",
            event:"host-ice",
            payload:{to:listenerId,candidate:e.candidate}
          });
        }
      };

      const offer=await pc.createOffer();
      await pc.setLocalDescription(offer);

      radioSignalChannel.send({
        type:"broadcast",
        event:"offer",
        payload:{to:listenerId,sdp:offer}
      });
    })
    .on("broadcast",{event:"leave"},async ({payload})=>{
      const listenerId=payload.listener_id;
      const joinedAt=radioHostStats.currentListeners[listenerId];
      if(joinedAt){
        const sec=Math.max(1, Math.round((Date.now()-joinedAt)/1000));
        radioHostStats.totalListenerMinutes += Math.ceil(sec/60);
        radioHostStats.totalPaidPoints += computeEarnedPointsFromSeconds(sec);
        delete radioHostStats.currentListeners[listenerId];
      }
      const pc=radioHostPeers[listenerId];
      if(pc){ try{pc.close()}catch(e){} delete radioHostPeers[listenerId]; }
    })
    .on("broadcast",{event:"answer"},async ({payload})=>{
      const pc=radioHostPeers[payload.from];
      if(pc && payload.sdp){
        await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
      }
    })
    .on("broadcast",{event:"listener-ice"},async ({payload})=>{
      const pc=radioHostPeers[payload.from];
      if(pc && payload.candidate){
        try{await pc.addIceCandidate(payload.candidate)}catch(e){console.warn(e)}
      }
    })
    .subscribe();
}
async function stopRadioRoom(){
  const client=radioClient();
  const roomId=radioCurrentRoomId || S.radioRoomId;
  const endTs=Date.now();

  Object.entries(radioHostStats.currentListeners||{}).forEach(([listenerId,joinedAt])=>{
    const sec=Math.max(1, Math.round((endTs-joinedAt)/1000));
    radioHostStats.totalListenerMinutes += Math.ceil(sec/60);
    radioHostStats.totalPaidPoints += computeEarnedPointsFromSeconds(sec);
  });
  radioHostStats.currentListeners={};

  const durationMinutes=Math.max(1, Math.ceil((endTs-(radioHostStats.startedAt||endTs))/60000));
  const earnedPt=radioHostStats.totalPaidPoints||0;

  Object.values(radioHostPeers).forEach(pc=>{try{pc.close()}catch(e){}});
  radioHostPeers={};

  if(radioLocalStream){
    radioLocalStream.getTracks().forEach(t=>t.stop());
    radioLocalStream=null;
  }

  if(radioSignalChannel && client){
    try{client.removeChannel(radioSignalChannel)}catch(e){}
    radioSignalChannel=null;
  }

  if(client && roomId){
    await client.from("cotorie_radio_rooms").update({
      active:false,
      ended_at:new Date().toISOString(),
      duration_minutes:durationMinutes,
      earned_pt:earnedPt
    }).eq("room_id",roomId);
  }

  setLastRadioSummary({
    roomId,
    durationMinutes,
    earnedPt,
    endedAt:new Date().toISOString()
  });

  radioCurrentRoomId=null;
  S.radioHosting=false;
  S.radioRoomId="";
  radioHostStats={startedAt:0,currentListeners:{},totalPaidPoints:0,totalListenerMinutes:0};
  render();
}

async function joinRadioRoom(roomId){
  const client=radioClient();
  if(!client){openChatSetup();return;}

  leaveRadioRoom();

  const rooms=await fetchLiveRadioRooms();
  const room=rooms.find(r=>r.room_id===roomId) || {room_id:roomId,cast_name:"キャスト",title:"配信中",cover_text:"配信中",description:"",tags:[]};

  radioListenerId="listener_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
  radioListenerJoinedAt=Date.now();
  radioCurrentRoomId=roomId;
  radioListenerPeer=new RTCPeerConnection(rtcConfig());

  const audio=document.querySelector("#radioAudio") || document.body.appendChild(Object.assign(document.createElement("audio"),{id:"radioAudio",autoplay:true}));
  audio.autoplay=true;

  radioListenerPeer.ontrack=e=>{
    audio.srcObject=e.streams[0];
    audio.play().catch(()=>{});
    const status=document.querySelector("#radioListenStatus");
    if(status) status.textContent="再生中";
  };

  radioSignalChannel=client.channel("radio:"+roomId);

  radioListenerPeer.onicecandidate=e=>{
    if(e.candidate){
      radioSignalChannel.send({
        type:"broadcast",
        event:"listener-ice",
        payload:{from:radioListenerId,candidate:e.candidate}
      });
    }
  };

  radioSignalChannel
    .on("broadcast",{event:"offer"},async ({payload})=>{
      if(payload.to!==radioListenerId) return;
      await radioListenerPeer.setRemoteDescription(new RTCSessionDescription(payload.sdp));
      const answer=await radioListenerPeer.createAnswer();
      await radioListenerPeer.setLocalDescription(answer);
      radioSignalChannel.send({
        type:"broadcast",
        event:"answer",
        payload:{from:radioListenerId,sdp:answer}
      });
    })
    .on("broadcast",{event:"host-ice"},async ({payload})=>{
      if(payload.to!==radioListenerId || !payload.candidate) return;
      try{await radioListenerPeer.addIceCandidate(payload.candidate)}catch(e){console.warn(e)}
    })
    .subscribe(status=>{
      if(status==="SUBSCRIBED"){
        radioSignalChannel.send({
          type:"broadcast",
          event:"join",
          payload:{listener_id:radioListenerId}
        });
      }
    });

  radioCommentsCache=[];
  subscribeRadioComments(roomId);
  await loadRadioComments(roomId);

  show(`<h3>ラジオを再生中 🎧</h3>
    <div id="radioListenStatus" class="connection-status wait">接続中…</div>
    ${makeLiveRoomCard(room, false)}
    <div class="listener-chat-panel">

        <button class="btn" onclick="sendListenerComment()">送信</button>
      </div>
    </div>
    <button class="btn alt full" style="margin-top:10px" onclick="leaveRadioRoom();closeM()">聴くのをやめる</button>`);
}function leaveRadioRoom(){
  const client=radioClient();

  if(radioSignalChannel && radioListenerId){
    try{
      radioSignalChannel.send({
        type:"broadcast",
        event:"leave",
        payload:{listener_id:radioListenerId}
      });
    }catch(e){}
  }

  if(radioListenerPeer){
    try{radioListenerPeer.close()}catch(e){}
    radioListenerPeer=null;
  }

  if(radioSignalChannel && client){
    try{client.removeChannel(radioSignalChannel)}catch(e){}
    radioSignalChannel=null;
  }
  if(radioCommentsChannel && client){
    try{client.removeChannel(radioCommentsChannel)}catch(e){}
    radioCommentsChannel=null;
  }

  const audio=document.querySelector("#radioAudio");
  if(audio){
    try{audio.pause()}catch(e){}

  }

  radioCurrentRoomId=null;
  radioListenerId=null;
  radioListenerJoinedAt=0;
}

  supabaseUrl:localStorage.cotorie_supabase_url||"",

let chatClient=null;
let chatChannel=null;

function ensureChatClient(){
  if(chatClient) return chatClient;
  if(!CHAT_DEFAULTS.supabaseUrl || !CHAT_DEFAULTS.supabaseAnon) return null;
  if(!window.supabase || !window.supabase.createClient) return null;
  chatClient=window.supabase.createClient(CHAT_DEFAULTS.supabaseUrl,CHAT_DEFAULTS.supabaseAnon);
  return chatClient;
}

function chatThreadId(a,b){

function escapeHtmlText(v){

function formatChatTime(ts){

function renderChatMessages(rows){
  const log=document.querySelector("#chatLog");

  if(!rows || !rows.length){
    log.innerHTML=`<div class="chat-empty">まだメッセージはありません。<br>ここから会話を始められます。</div>`;
    return;
  }

  log.innerHTML=rows.map(m=>{
    const mine=m.sender_id===myId;
    const stampClass=m.message_type==="stamp"?" stamp-message":"";
    return `<div class="bubble ${mine?"me":"them"}${stampClass}" data-message-id="${m.id||""}">
      ${messageBodyHtml(m)}
      <div class="chat-message-time">${formatChatTime(m.created_at)}</div>
    </div>`;
  }).join("");
  log.scrollTop=log.scrollHeight;
}

function appendChatMessage(m,extraClass=""){
  const log=document.querySelector("#chatLog");
  if(!log) return;

  log.querySelector(".chat-empty")?.remove();

  const mine=m.sender_id===currentAccountId();
  const el=document.createElement("div");
  const stampClass=m.message_type==="stamp"?" stamp-message":"";
  el.className=`bubble ${mine?"me":"them"}${stampClass} ${extraClass}`.trim();
  if(m.id) el.dataset.messageId=m.id;
  el.innerHTML=`${messageBodyHtml(m)}<div class="chat-message-time">${formatChatTime(m.created_at)}</div>`;
  log.appendChild(el);
  log.scrollTop=log.scrollHeight;
  return el;
}

function showChatError(message){

    box=document.createElement("div");
    box.id="chatError";

    compose?.parentNode?.insertBefore(box,compose);
  }

function clearChatError(){
  document.querySelector("#chatError")?.remove();
}

async function loadChatMessages(){
  const client=ensureChatClient();
  const status=document.querySelector("#chatStatus");

  if(!client){
    if(status) status.textContent="Supabase未設定";
    renderChatMessages([]);
    return;
  }

  try{
    const thread=await ensureConversation() || chatThreadId(currentAccountId(),peerAccountId());
    if(status) status.textContent="接続中…";

    const {data,error}=await client
      .from("cotorie_messages")
      .select("id,thread_id,sender_id,receiver_id,body,message_type,stamp_id,created_at")
      .eq("thread_id",thread)
      .order("created_at",{ascending:true});

    if(error) throw error;

    if(status) status.textContent="オンライン";
    clearChatError();
    renderChatMessages(data||[]);
    subscribeChat(thread);
  }catch(err){
    console.error("loadChatMessages:",err);
    if(status) status.textContent="読込エラー";
    showChatError(`履歴を読み込めませんでした：${err?.message||String(err)}`);
  }
}

function subscribeChat(thread){
  const client=ensureChatClient();
  if(!client) return;

  if(chatChannel){
    try{client.removeChannel(chatChannel)}catch(e){}
    chatChannel=null;
  }

  chatChannel=client.channel("cotorie-chat:"+thread)
    .on(
      "postgres_changes",
      {event:"INSERT",schema:"public",table:"cotorie_messages",filter:`thread_id=eq.${thread}`},
      payload=>{
        const row=payload.new;
        const exists=row?.id && document.querySelector(`[data-message-id="${row.id}"]`);
        if(S.page==="chat" && chatThreadId(currentAccountId(),peerAccountId())===thread && !exists && row) appendChatMessage(row);
        loadMessageList();
      }
    )
    .subscribe();
}

async function sendChatMessage(){

async function sendChatPayload(body,messageType="text",stampId=null){
  const input=document.querySelector("#chatInput");
  const status=document.querySelector("#chatStatus");
  const btn=document.querySelector(".chat-send");
  const client=ensureChatClient();

  if(!client){
    openChatSetup();
    return;
  }

  const sender=currentAccountId();
  const receiver=peerAccountId();
  const optimistic={
    sender_id:sender,
    receiver_id:receiver,
    body:body||"",
    message_type:messageType,
    stamp_id:stampId,
    created_at:new Date().toISOString()
  };

  clearChatError();
  const optimisticEl=appendChatMessage(optimistic,"pending");

  if(messageType==="text" && input) input.value="";
  if(btn) btn.disabled=true;
  if(status) status.textContent="送信中…";

  try{
    const thread=await ensureConversation() || chatThreadId(sender,receiver);

    const {data,error}=await client
      .from("cotorie_messages")
      .insert({
        thread_id:thread,
        sender_id:sender,
        receiver_id:receiver,
        body:body||"",
        message_type:messageType,
        stamp_id:stampId
      })
      .select("id,thread_id,sender_id,receiver_id,body,message_type,stamp_id,created_at")
      .single();

    if(error) throw error;
    if(!data || !data.id) throw new Error("メッセージ保存後のデータを取得できませんでした");

    if(optimisticEl){
      document.querySelector(`[data-message-id="${data.id}"]`)?.remove();
      optimisticEl.className=`bubble me${data.message_type==="stamp"?" stamp-message":""}`;
      optimisticEl.dataset.messageId=data.id;
      optimisticEl.innerHTML=`${messageBodyHtml(data)}<div class="chat-message-time">${formatChatTime(data.created_at)}</div>`;
    }

    if(status) status.textContent="送信済み";
    await loadMessageList();
    setTimeout(()=>{const s=document.querySelector("#chatStatus");if(s)s.textContent="オンライン"},700);

    const verify=await client
      .from("cotorie_messages")
      .select("id")
      .eq("id",data.id)
      .maybeSingle();

    if(verify.error) throw verify.error;
    if(!verify.data) throw new Error("送信したメッセージをDBから再確認できませんでした");

  }catch(err){
    console.error("sendChatPayload:",err);

    if(optimisticEl){
      optimisticEl.classList.remove("pending");
      optimisticEl.classList.add("failed");
    }

    if(messageType==="text" && input && !input.value) input.value=body;
    if(status) status.textContent="送信失敗";
    showChatError(`送信できませんでした：${err?.message||String(err)}`);
  }finally{
    if(btn) btn.disabled=false;
  }
}

async function saveChatSetup(){
  const url=(document.querySelector("#chatSbUrl")?.value||"").trim();
  const key=(document.querySelector("#chatSbAnon")?.value||"").trim();
  const status=document.querySelector("#chatSetupStatus");
  const btn=document.querySelector("#chatConnectBtn");

  if(!url || !key){
    if(status){
      status.className="connection-status ng";
      status.textContent="Project URLとPublishable keyの両方を入力してください。";
    }
    return;
  }

  if(btn){
    btn.disabled=true;
    btn.textContent="接続テスト中…";
  }
  if(status){
    status.className="connection-status wait";
    status.textContent="Supabaseへ接続しています…";
  }

  localStorage.cotorie_supabase_url=url;
  localStorage.cotorie_supabase_anon=key;
  CHAT_DEFAULTS.supabaseUrl=url;
  CHAT_DEFAULTS.supabaseAnon=key;
  chatClient=null;

  try{
    const client=ensureChatClient();
    if(!client){
      throw new Error("Supabaseクライアントを作成できませんでした");
    }

    // 1. Table connection test
    const test=await client
      .from("cotorie_profiles")
      .select("account_id")
      .limit(1);

    if(test.error) throw test.error;

    // 2. Profile upsert directly here; do not depend on another helper.
    const role=S.role||"user";
    const p=getProfile(role);
    const account_id=currentAccountId();

    const payload={
      account_id:account_id,
      role:role,
      nickname:(p&&p.name)||role,
      avatar_text:(p&&p.icon)||"",
      hobbies:(p&&p.hobbies)||"",
      bio:(p&&p.bio)||"",
      updated_at:new Date().toISOString()
    };

    const profileResult=await client
      .from("cotorie_profiles")
      .upsert(payload,{onConflict:"account_id"});

    if(profileResult.error) throw profileResult.error;

    if(status){
      status.className="connection-status ok";
      status.innerHTML="✅ 接続できました。<br>Cotorieの会話機能が利用できます。";
    }
    if(btn){
      btn.disabled=false;
      btn.textContent="接続済み";
    }
  }catch(err){
    console.error("Supabase connection test:",err);
    if(status){
      status.className="connection-status ng";
      const msg=err?.message||String(err);
      status.innerHTML=`❌ 接続できませんでした。<br><span style="font-size:11px">${escapeHtmlText(msg)}</span>`;
    }
    if(btn){
      btn.disabled=false;
      btn.textContent="もう一度接続テスト";
    }
  }
}


async function ensureConversation(){
  const client=ensureChatClient();
  if(!client) return null;

  const a=currentAccountId();
  const b=peerAccountId();
  const thread=chatThreadId(a,b);

  const payload={
    thread_id:thread,
    user_account_id:S.chatRole==="cast"?b:a,
    cast_account_id:S.chatRole==="cast"?a:b,
    updated_at:new Date().toISOString()
  };

  const {error}=await client
    .from("cotorie_conversations")
    .upsert(payload,{onConflict:"thread_id"});

  if(error) throw error;
  return thread;
}

}
