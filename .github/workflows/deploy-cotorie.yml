name: Deploy latest Cotorie

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find latest Cotorie
        shell: bash
        run: |
          mkdir -p _site

          latest=$(find . -maxdepth 1 -type f -name 'index_v*.html' \
            | sed 's#^\./##' \
            | sort -V \
            | tail -n 1)

          if [ -z "$latest" ]; then
            echo "index_v*.html が見つかりません"
            exit 1
          fi

          echo "Latest file: $latest"
          cp "$latest" _site/index.html

          [ -f manifest.json ] && cp manifest.json _site/
          [ -f sw.js ] && cp sw.js _site/
          [ -f icon-192.png ] && cp icon-192.png _site/
          [ -f icon-512.png ] && cp icon-512.png _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
