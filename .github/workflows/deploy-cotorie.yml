name: Deploy latest Cotorie

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest Cotorie
        shell: bash
        run: |
          mkdir -p _site

          latest=$(find . -maxdepth 1 -type f -name 'index_v*.html' \
            | sed 's#^\./##' \
            | sort -V \
            | tail -n 1)

          if [ -z "$latest" ]; then
            echo "index_v*.html が見つかりません"
            exit 1
          fi

          echo "Latest file: $latest"
          cp "$latest" _site/index.html

          if [ -f manifest.json ]; then
            cp manifest.json _site/
          fi

          if [ -f sw.js ]; then
            cp sw.js _site/
          fi

          if [ -f icon-192.png ]; then
            cp icon-192.png _site/
          fi

          if [ -f icon-512.png ]; then
            cp icon-512.png _site/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
