name: Update latest index

on:
  push:
    branches:
      - main
    paths:
      - "index_v*.html"
      - ".github/workflows/update-index.yml"

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find latest version and update index.html
        shell: bash
        run: |
          set -e

          latest=$(find . -maxdepth 1 -type f -name 'index_v*.html' -printf '%f\n' | sort -V | tail -n 1)

          if [ -z "$latest" ]; then
            echo "No index_v*.html file found."
            exit 1
          fi

          echo "Latest version: $latest"
          cp "$latest" index.html

      - name: Commit updated index.html
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html
          git commit -m "Auto-update index.html to latest version"
          git push
